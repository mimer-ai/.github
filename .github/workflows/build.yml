name: Build README

on:
  push:
  workflow_dispatch:
    inputs:
      all:
        description: 'Run against every repo (full scan, ignores the 20-hour window)'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 0 * * *'  # Daily

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        python-version: "3.13"
    - name: Update README
      env:
        GITHUB_TOKEN: ${{ secrets.SEAIF_RELEASES_TOKEN }}
      run: |-
        if [ "${{ inputs.all }}" = "true" ]; then
          uv run build_readme.py --all
        else
          uv run build_readme.py
        fi
        cat README.md
    - name: Commit and push if changed
      run: |-
        git diff
        git config --global user.email "actions@users.noreply.github.com"
        git config --global user.name "README-bot"
        git add -A
        git commit -m "Updated content" || exit 0
        git push
